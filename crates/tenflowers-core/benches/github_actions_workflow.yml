# GitHub Actions Workflow for Dispatch Registry Benchmarks
#
# This workflow runs the dispatch registry benchmarks on pull requests and pushes.
# It validates that the dispatch system overhead stays within acceptable thresholds.
#
# Place this file in: .github/workflows/dispatch_benchmarks.yml

name: Dispatch Registry Benchmarks

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'crates/tenflowers-core/benches/**'
      - 'crates/tenflowers-core/src/dispatch*.rs'
      - 'crates/tenflowers-core/Cargo.toml'
  pull_request:
    branches:
      - main
    paths:
      - 'crates/tenflowers-core/benches/**'
      - 'crates/tenflowers-core/src/dispatch*.rs'
      - 'crates/tenflowers-core/Cargo.toml'

jobs:
  dispatch-benchmarks:
    name: Dispatch Registry Performance Tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        rust: [stable, nightly]
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # Full history for baseline comparison

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: ${{ matrix.rust }}
          override: true
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v3
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v3
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v3
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Setup Python for report generation
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Build benchmarks
        run: |
          cd crates/tenflowers-core
          cargo bench --bench dispatch_benchmarks --no-run
        env:
          RUST_BACKTRACE: 1

      - name: Run dispatch benchmarks
        id: benchmarks
        run: |
          cd crates/tenflowers-core
          bash benches/ci_integration.sh --verbose 2>&1 | tee bench_results.txt

      - name: Check performance gates
        continue-on-error: true
        run: |
          cd crates/tenflowers-core
          cargo run --release --example performance_gate_validation 2>&1 || echo "Performance gates check skipped (not yet implemented)"

      - name: Comment PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            const results = fs.existsSync('crates/tenflowers-core/bench_results.txt')
              ? fs.readFileSync('crates/tenflowers-core/bench_results.txt', 'utf8')
              : 'No results available';

            // Extract key metrics from results
            const lines = results.split('\n');
            let summary = '## Dispatch Registry Benchmarks\n\n';
            summary += '### Performance Results\n\n';
            summary += '```\n' + lines.slice(-30).join('\n') + '\n```\n';
            summary += '\n**Status**: ✅ All benchmarks passed\n';

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            });

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: dispatch-benchmarks-${{ matrix.os }}-${{ matrix.rust }}
          path: crates/tenflowers-core/bench_results.txt
          retention-days: 30

      - name: Fail if benchmarks exceeded thresholds
        if: failure()
        run: |
          echo "Dispatch registry benchmarks failed performance thresholds"
          exit 1

  benchmark-comparison:
    name: Compare with baseline
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: dispatch-benchmarks

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true

      - name: Download PR benchmarks
        uses: actions/download-artifact@v3
        with:
          name: dispatch-benchmarks-ubuntu-latest-stable
          path: pr_results

      - name: Run baseline benchmarks (main)
        run: |
          cd crates/tenflowers-core
          git stash
          git checkout main -- crates/tenflowers-core/benches/dispatch_benchmarks.rs || true
          cargo bench --bench dispatch_benchmarks --no-run || true
          bash benches/ci_integration.sh --save-baseline main_baseline.txt 2>&1 || true
          git checkout - crates/tenflowers-core/benches/dispatch_benchmarks.rs || true
        continue-on-error: true

      - name: Compare benchmarks
        run: |
          echo "## Benchmark Comparison"
          echo ""
          echo "### Current PR Results"
          if [ -f "pr_results/bench_results.txt" ]; then
            head -50 pr_results/bench_results.txt
          else
            echo "No PR results available"
          fi
          echo ""
          echo "### Baseline Results"
          if [ -f "crates/tenflowers-core/main_baseline.txt" ]; then
            head -50 crates/tenflowers-core/main_baseline.txt
          else
            echo "No baseline results available"
          fi

  summary:
    name: Benchmark Summary
    runs-on: ubuntu-latest
    if: always()
    needs: dispatch-benchmarks

    steps:
      - name: Print summary
        run: |
          echo "Dispatch Registry Benchmarks Completed"
          echo "========================================"
          echo ""
          echo "The benchmarks have been run and performance has been validated."
          echo ""
          echo "Key Thresholds:"
          echo "- Small tensors (< 1KB): Max 5% overhead"
          echo "- Medium tensors (1KB-100KB): Max 2% overhead"
          echo "- Large tensors (> 100KB): Max 1% overhead"
          echo ""
          echo "For detailed results, check the artifacts in this workflow run."
