[package]
name = "tenflowers-core"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Core tensor operations and execution engine for TenfloweRS"
documentation = "https://docs.rs/tenflowers-core"
readme = "README.md"

[lints]
workspace = true

[dependencies]
# SciRS2 ecosystem - provides ndarray, random, etc.
scirs2-core = { workspace = true, features = ["random", "memory_management", "memory_efficient", "parallel", "simd", "profiling"] }
scirs2-linalg = { workspace = true }
rayon = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
rmp-serde = { workspace = true, optional = true }
oxiarc-archive = { workspace = true, optional = true }
thiserror = { workspace = true }
bytemuck = { workspace = true }
ndarray-linalg = { workspace = true, optional = true }
oxiblas-ndarray = { workspace = true, optional = true }
lazy_static = { workspace = true }
sys-info = { workspace = true }
oxifft = { workspace = true }
num-complex = { workspace = true }
oxicode = { workspace = true }
num_cpus = { workspace = true }
half = { workspace = true }
petgraph = { workspace = true }
once_cell = { workspace = true }
uuid = { workspace = true }

# Optional GPU support
wgpu = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
pollster = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["rt", "macros", "sync"] }
tokio-stream = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }

# Optional WASM support
wasm-bindgen = { workspace = true, optional = true }
js-sys = { workspace = true, optional = true }
web-sys = { workspace = true, optional = true }

# Optional ONNX support
prost = { workspace = true, optional = true }
prost-types = { workspace = true, optional = true }

# Platform-specific dependencies for memory tracking
[target.'cfg(target_os = "macos")'.dependencies]
libc = { workspace = true }
metal = { workspace = true, optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
approx = { workspace = true }

[features]
default = ["std", "parallel"]
std = []
parallel = ["rayon"]
gpu = ["wgpu", "futures", "pollster", "tokio", "tokio-stream", "async-trait"]
# CUDA features are only available on Linux and Windows.
# Enabling cuda/cudnn/nccl gates the relevant modules but does NOT link against
# any CUDA SDK. Real CUDA support requires adding cudarc/cuda-sys/nccl-sys deps
# and linking libcudart.so / libcudnn.so / libnccl.so at build time.
cuda = ["gpu"]
# cudnn — all 11 operations return NotImplemented (no libcudnn.so linked).
cudnn = ["gpu", "cuda"]
# opencl — routes to wgpu; no OpenCL SDK. Present for API surface completeness.
opencl = ["gpu"]
metal = ["gpu", "dep:metal"]
# rocm — all HIP FFI stubs return NotImplemented (no libamdhip64.so linked).
rocm = ["gpu"]
# nccl — all collective operations return NotImplemented (no libnccl.so linked).
nccl = ["gpu", "cuda"]
# BLAS support via ndarray-linalg and oxiblas
blas = ["ndarray-linalg"]
blas-openblas = ["blas", "ndarray-linalg/openblas-system"]
blas-oxiblas = ["blas", "oxiblas-ndarray"]
blas-mkl = ["blas", "ndarray-linalg/intel-mkl-system"]
blas-accelerate = ["blas"]
# simd — reserved for future explicit SIMD opt-in; currently a no-op.
# CPU SIMD is always available via the simd module (using std::arch intrinsics
# detected at runtime). Enabling this feature gates optional dispatch_registry
# SIMD kernel paths and benchmark helpers only.
simd = []
serialize = ["serde", "serde_json", "rmp-serde"]
compression = ["dep:oxiarc-archive"]
benchmark = ["serialize"]
wasm = ["wasm-bindgen", "js-sys", "web-sys"]
onnx = ["prost", "prost-types"]
autograd = []

[[bench]]
name = "dispatch_benchmarks"
harness = false
