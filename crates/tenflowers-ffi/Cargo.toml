[package]
name = "tenflowers-ffi"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Python bindings for TenfloweRS"
readme = "README.md"
publish = false  # Excluded from release - requires Python development environment

[lints]
workspace = true

[lib]
name = "tenflowers"
crate-type = ["cdylib", "rlib"]

[dependencies]
tenflowers-core = { workspace = true }
tenflowers-autograd = { workspace = true }
tenflowers-neural = { workspace = true }
tenflowers-dataset = { workspace = true }
scirs2-core = { workspace = true }
scirs2-autograd = { workspace = true }
pyo3 = { workspace = true }
scirs2-numpy = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
libloading = { workspace = true }
libc = { workspace = true }

[features]
default = []
extension-module = ["pyo3/extension-module"]
gpu = ["tenflowers-core/gpu"]
# Feature to enable FFI tests when Python environment is available
python-tests = []